services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile_nginx
    env_file:
      - ./server/php/.env
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HOME: /var/corrai/home
      PADDLE_PDX_CACHE_HOME: /var/corrai/home/.paddlex
    volumes:
      - './server/log:/var/log/corrai'
      - './server/php:/var/corrai/php'
      - './server/python/pycorrai:/var/corrai/python/pycorrai'
      - 'paddle_cache:/var/corrai/home'
      - './docker/php/nginx-default.conf:/etc/nginx/sites-available/default'
      - './docker/php.ini:/usr/local/etc/php/conf.d/99-custom.ini'
      - './docker/php/zz-clear-env.conf:/usr/local/etc/php-fpm.d/zz-clear-env.conf'
      - './client/dist:/var/www/client'
      - './admin_client/dist:/var/www/admin_client'
    ports:
      - '80:80'
    depends_on:
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy
      php-consumer:
        condition: service_started
      ocr-consumer:
        condition: service_started
  php-consumer:
    build:
      context: .
      dockerfile: docker/php/Dockerfile_nginx
    restart: unless-stopped
    env_file:
      - ./server/php/.env
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HOME: /var/corrai/home
      PADDLE_PDX_CACHE_HOME: /var/corrai/home/.paddlex
      PHP_ERROR_LOG_STDERR: "true"
      NCHAN_PUBLISH_URL: http://127.0.0.1/internal/pub
    volumes:
      - './server/log:/var/log/corrai'
      - './server/php:/var/corrai/php'
      - './server/python/pycorrai:/var/corrai/python/pycorrai'
      - 'paddle_cache:/var/corrai/home'
    command: ["php", "/var/corrai/php/cli/redis_consumer.php"]
    depends_on:
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy
  ocr-consumer:
    build:
      context: .
      dockerfile: docker/php/Dockerfile_nginx
    restart: unless-stopped
    env_file:
      - ./server/php/.env
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HOME: /var/corrai/home
      PADDLE_PDX_CACHE_HOME: /var/corrai/home/.paddlex
      PYTHONPATH: /var/corrai/python/pycorrai
      PYTHONUNBUFFERED: "1"
      NCHAN_PUBLISH_URL: http://127.0.0.1/internal/pub
    volumes:
      - './server/log:/var/log/corrai'
      - './server/python/pycorrai:/var/corrai/python/pycorrai'
      - 'paddle_cache:/var/corrai/home'
    command:
      [
        "/var/corrai/python/.venv/bin/python",
        "-m",
        "pycorrai.consumer",
      ]
    depends_on:
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    env_file:
      - ./server/php/.env
    volumes:
      - './docker/storage:/data'
    ports:
      - '8333:8333'
      - '8888:8888'
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"corrai","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.telemetry=false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 8s
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - 'redis_data:/data'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  paddle_cache:
  redis_data:
