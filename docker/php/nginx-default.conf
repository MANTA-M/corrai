server {
    listen 80;
    server_name corrai.local;
    root /var/corrai/php/public;
    index index.html index.php;
    client_max_body_size 40M;

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr;

    # HTTP/2 support
    http2 on;

    # Nchan SSE Subscriber (clients Web)
    location ^~ /events-api/ {
        set $sse_channel "";
        if ($uri ~ "^/events-api/(.+)$") {
            set $sse_channel $1;
        }
        nchan_subscriber eventsource;
        nchan_channel_id $sse_channel;
        nchan_message_buffer_length 10;
        nchan_message_timeout 5m;
    }
    # Nchan Publisher (PHP local)
    location ^~ /internal/pub/ {
        set $sse_channel "";
        if ($uri ~ "^/internal/pub/(.+)$") {
            set $sse_channel $1;
        }
        nchan_publisher;
        nchan_channel_id $sse_channel;
        nchan_message_buffer_length 10;
        nchan_message_timeout 5m;
        allow 127.0.0.1;
        deny all;
    }

    # API location with PHP-FPM
    location /api/ {
        # Route all API requests to api_router.php
        # Preserve query string with $is_args$args
        try_files $uri /api_router.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 120s;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Admin SPA API under /adm/api/
    location ^~ /adm/api/ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 120s;
        fastcgi_param SCRIPT_FILENAME /var/corrai/php/public/api_router.php;
        fastcgi_param DOCUMENT_ROOT /var/corrai/php/public;
        fastcgi_param SCRIPT_NAME /api_router.php;
        client_max_body_size 40M;
    }

    location ^~ /adm/ {
        alias /var/www/admin_client/;
        try_files $uri index.html /adm/index.html -404;
    }

    location = /adm {
        return 301 /adm/;
    }

    # Vue client at the site root. /corrai_test is the test-server base only.
    location / {
        root /var/www/client;
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
