server {
    listen 80;
    server_name corrai.local;
    root /var/corrai/php/public;
    index index.html index.php;
    client_max_body_size 40M;

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr;

    # HTTP/2 support
    http2 on;

    # Main location
    location / {
        try_files $uri $uri/ /api_router.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # API location with PHP-FPM
    location /api/ {
        # Route all API requests to api_router.php
        # Preserve query string with $is_args$args
        try_files $uri /api_router.php?$args;
    }

    location = /corrai_test/api/assessment_events {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/corrai/php/public/api_router.php;
        fastcgi_param DOCUMENT_ROOT /var/corrai/php/public;
        fastcgi_param SCRIPT_NAME /api_router.php;
        fastcgi_buffering off;
        gzip off;
        fastcgi_read_timeout 3600s;
    }

    location ^~ /corrai_test/api/ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/corrai/php/public/api_router.php;
        fastcgi_param DOCUMENT_ROOT /var/corrai/php/public;
        fastcgi_param SCRIPT_NAME /api_router.php;
        client_max_body_size 40M;
    }

    location ^~ /corrai_test/ {
        alias /var/www/client/;
        try_files $uri index.html /corrai_test/index.html -404;
    }

    location = /corrai_test {
        return 301 /corrai_test/;
    }

    # Admin SPA API under /corrai_test_adm/api/
    location ^~ /corrai_test_adm/api/ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/corrai/php/public/api_router.php;
        fastcgi_param DOCUMENT_ROOT /var/corrai/php/public;
        fastcgi_param SCRIPT_NAME /api_router.php;
        client_max_body_size 40M;
    }

    location ^~ /corrai_test_adm/ {
        alias /var/www/admin_client/;
        try_files $uri index.html /corrai_test_adm/index.html -404;
    }

    location = /corrai_test_adm {
        return 301 /corrai_test_adm/;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

