server {
    listen 80;
    server_name corrai.local;
    root /var/corrai/php/public;
    index index.html index.php;
    client_max_body_size 40M;

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr;

    # HTTP/2 support
    http2 on;

    # Main location
    location / {
        try_files $uri $uri/ /api_router.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # API location with PHP-FPM
    location /api/ {
        # Route all API requests to api_router.php
        # Preserve query string with $is_args$args
        try_files $uri /api_router.php?$args;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

