[project]
name = "pycorrai"
version = "0.1.0"
description = "Corrai Python workers: OCR, LLM correction, and Redis assessment tasks."
requires-python = ">=3.10"
dependencies = [
    "paddleocr>=3.7.0,<3.8.0",
    "python-doctr>=0.11.0,<0.13.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "mindee>=4.0.0",
]

[project.scripts]
pycorrai = "pycorrai.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pycorrai*"]
