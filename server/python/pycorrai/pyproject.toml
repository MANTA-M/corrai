[project]
name = "pycorrai"
version = "0.1.0"
description = "OCR a document and print each word with its coordinates as JSON."
requires-python = ">=3.10"
dependencies = [
    "paddleocr>=3.7.0,<3.8.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
]

[project.scripts]
pycorrai = "pycorrai.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pycorrai*"]
