name: Deploy on test server

on:
  push:
    branches:
      - 'dev'
      - 'cursor/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} to mantam.eu test environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H mantam.eu >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'client/node_modules/' \
            --exclude 'client/dist/' \
            --exclude 'server/php/vendor/' \
            --exclude 'server/php/.env' \
            --exclude 'client/.env.local' \
            --exclude 'client/vite.config.ts' \
            --exclude 'docker/storage/' \
            ./ maintainer@mantam.eu:/home/maintainer/corrai_test/

      - name: Build client on server
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes maintainer@mantam.eu '
            set -e
            cd /home/maintainer/corrai_test/client
            if [ ! -f vite.config.ts ]; then
              cp vite.config_remote.ts vite.config.ts
            fi
            npm ci
            npm run build
          '

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
